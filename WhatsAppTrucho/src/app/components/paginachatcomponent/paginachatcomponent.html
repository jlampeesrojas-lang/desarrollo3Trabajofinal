<div class="contenedor" [class.con-chat]="hayChat()">
  <aside class="panel-lista"><app-chatlistacomponent /></aside>
  <section class="panel-ventana">
    <router-outlet />
    @if (!hayChat()) {
      <div class="vacio">
        <div class="icono">💬</div>
        <p>Selecciona un chat para ver los mensajes</p>
      </div>
    }
  </section>
</div>
