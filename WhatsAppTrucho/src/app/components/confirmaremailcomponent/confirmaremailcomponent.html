<main class="confirmar">
    <div class="tarjeta">
        @if (estado === 'cargando') {
            <h2>Confirmando tu correo...</h2>
        } @else if (estado === 'ok') {
            <h2>¡Listo!</h2>
            <p class="ok">{{ mensaje }}</p>
            <button type="button" class="btn" (click)="irAlLogin()">Iniciar sesión</button>
        } @else {
            <h2>No se pudo confirmar</h2>
            <p class="error">{{ mensaje }}</p>
            <button type="button" class="btn" (click)="irAlLogin()">Ir al inicio de sesión</button>
        }
    </div>
</main>
