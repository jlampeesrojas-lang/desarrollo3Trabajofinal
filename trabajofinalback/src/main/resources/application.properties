spring.application.name=trabajofinalback
server.port=8080

spring.config.import=file:./secrets.properties

spring.datasource.url=jdbc:mysql://mysqldes3.gpcueb.org:3306/estudiante54
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:}
jwt.access-expiration-ms=7200000
jwt.refresh-expiration-days=7

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME:}
app.email-token-expiration-hours=24

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.seed.enabled=${SEED_ENABLED:true}
app.seed.password=${SEED_PASSWORD:Admin#2026Chat}

giphy.url=https://api.giphy.com/v1/gifs/search
giphy.api.key=${GIPHY_API_KEY:}

ipapi.url=http://ip-api.com/json/

groq.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

springdoc.swagger-ui.path=/
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.supported-submit-methods=get,post,put,delete,patch
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.disable-swagger-default-url=true